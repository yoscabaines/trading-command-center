name = "trading-command-center"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# KV namespaces. Create these with:
#   wrangler kv namespace create SETUPS_KV
#   wrangler kv namespace create JOURNAL_KV
#   wrangler kv namespace create QUEUE_KV
#   wrangler kv namespace create CACHE_KV
# then paste the returned ids below.
# ---------------------------------------------------------------------------
kv_namespaces = [
  { binding = "SETUPS_KV",  id = "5e8c2688b49942d0976fe3260265a0a9" },
  { binding = "JOURNAL_KV", id = "fe3602acec4245e59f0a4ba51754dcfc" },
  { binding = "QUEUE_KV",   id = "5dd7317b71df4793a0f15a1af9fa9731" },
  { binding = "CACHE_KV",   id = "2c3b14d4fe6d4d848e6a34425d06ff3f" },
]

# ---------------------------------------------------------------------------
# Scheduled scans. Cron is UTC. These times approximate:
#   12:00 UTC ~ 8:00am ET (premarket scan)
#   14:35 UTC ~ 10:35am ET (mid-morning re-scan)
#   19:45 UTC ~ 3:45pm ET (pre-close evaluation)
# Adjust for DST yourself — Workers cron does not know about ET/DST, the
# marketHours module compensates at runtime (see src/engine/marketHours.js).
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 12 * * 1-5", "35 14 * * 1-5", "45 19 * * 1-5"]

# Allows `import html from './ui/index.html'` to pull in the raw file as a
# string at build time (Wrangler's text module rule).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
# Non-secret config. Real secrets go in `wrangler secret put NAME`, never here.
APP_ENV = "development"

# Secrets (set via `wrangler secret put <NAME>`, documented in README):
#   TRADIER_TOKEN      - options chains + quotes (sandbox or production)
#   FINNHUB_API_KEY    - news / earnings / analyst catalysts
#   ALPHAVANTAGE_KEY   - fallback quotes / fundamentals (optional)
